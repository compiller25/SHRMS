services:
  - type: web
    name: smrs-backend
    env: python
    plan: free
    region: oregon
    
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    
    startCommand: |
      cd backend
      gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
    
    envVarFile: backend/.env
