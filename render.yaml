services:
  - type: web
    name: smrs-backend
    env: python
    pythonVersion: 3.10
    plan: free
    region: oregon
    
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      rm -f db.sqlite3
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput --clear
    
    startCommand: |
      cd backend
      gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    
    envVars:
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
    
    envVarFile: backend/.env
